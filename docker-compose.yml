# Shared LMS MySQL for local teamwork.
# Start: docker compose up -d
# App URL: mysql://root:LmsDocker2026@127.0.0.1:3307/sft_lms
services:
  mysql:
    image: mysql:8.0
    container_name: sft-lms-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: LmsDocker2026
      MYSQL_DATABASE: sft_lms
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - sft_lms_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pLmsDocker2026"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sft_lms_mysql:
