# Include inside the sftlms.com server { } block (HTTP and HTTPS).
# Serves hashed CSS/JS from disk with real MIME types so browsers do not
# treat a Next.js 500 body (text/plain) as a stylesheet.
location /_next/static/ {
    alias /var/www/lms/.next/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    types {
        text/css css;
        application/javascript js;
        application/javascript mjs;
        font/woff2 woff2;
        application/octet-stream map;
    }
    default_type application/octet-stream;
}
