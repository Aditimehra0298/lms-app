# Include inside the sftlms.com server { } block (HTTP and HTTPS), next to lms-next-static.conf.
# Node authorises /api/media/serve/* and replies with X-Accel-Redirect; nginx then streams the
# file from disk. `internal` means browsers can never request this path directly.
location /_lms_protected_files/ {
    internal;
    alias /var/www/lms/;
    sendfile on;
    tcp_nopush on;
    sendfile_max_chunk 1m;
    access_log off;
}
