# Include inside the sftlms.com server { } block (HTTP and HTTPS).
# Top-level files from public/ (images, hero video, fonts) are served straight from disk with a
# 7-day browser/Cloudflare cache instead of going through Node with "no-store".
location ~* ^/[^/]+\.(?:png|jpe?g|webp|gif|svg|ico|avif|mp4|webm|woff2?)$ {
    root /var/www/lms/public;
    try_files $uri @lms_next;
    access_log off;
    sendfile on;
    tcp_nopush on;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location @lms_next {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
